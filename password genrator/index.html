<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title> Password Genrator | javascript project </title>
</head>
<body>
    <div class="container">
        <h1>Password Genrator</h1>
        <div class="inputBox">
        <input type="text" class="passbox" id="passbox" disabled><span class="material-symbols-outlined" id="copyicon">
content_copy
</span>
        </div>

        <input type="range" min="1" max="30" value="4" id="inputslider">
       <div class="row">
         <p>Password Length</p>
        <span id="slidervalue"></span>
    </div>
    <div class="row">
        <label for="lowercase">Include lowercase Letter (a-z)</label>
        <input type="checkbox" name="lowercase" id="lowercase">
    </div>
    <div class="row">
    <label for="uppercase">Include uppercase Letter (A-Z)</label>
    <input type="checkbox" name="uppercase" id="uppercase"> 
    </div>
    <div class="row">
    <label for="numbers">Include numbers (0-9)</label>
    <input type="checkbox" name="numbers" id="numbers">
    </div>
    <div class="row">
    <label for="symbols">Include symbols (!-*)</label>
    <input type="checkbox" name="symbols" id="symbols">
    </div>
    <button type="button" class="genbtn" id="genbtn">Genrate Password</button>
</div>
<script src="scripit.js"></script>
</body>
</html>
